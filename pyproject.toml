[project]
name = "parathink"
version = "0.1.0"
description = "Asynchronous thinking streams for full-duplex spoken agents"
requires-python = ">=3.10"
# The repository is not distributed as an installable package: the cluster and
# local runs use conda environments (environment.yml + requirements.txt), and the
# former P0 `src/interclarify` scaffold was removed in the 2026-10-14 cleanup.
# This file now only keeps project metadata, the dependency groups and pytest
# settings.  See docs/scripts/check_env.md.
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
runtime = [
    "torch>=2.1.0",
    "numpy>=1.24.0",
    "websockets>=12.0,<14.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "sounddevice>=0.4.6",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "aiohttp>=3.9",
]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
