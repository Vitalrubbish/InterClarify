# InterClarify 基础配置（所有 profile 共享）。
# 研究范围与约束见 docs/research_design.md，工程门禁见 docs/engineering_implementation.md。
schema_version: 1

run:
  # 相对仓库根目录的运行输出目录；每次运行在其中生成 <run_prefix>-<时间>-<随机> 子目录。
  output_root: experiments
  run_prefix: ic
  seed: 0
  tags: []
  # 可选会话标识，写入每条日志事件；离线回放由调用方赋值。
  session_id: null

paths:
  # "." 表示以实际仓库根目录为准；cluster profile 会覆盖为共享存储绝对路径。
  repo_root: "."
  data_root: data
  model_root: models
  artifact_root: artifacts

device:
  # backend: cpu | cuda
  backend: cpu
  index: 0
  # 需要固定可见 GPU 时设置，例如 "0" 或 "0,1"；null 表示不修改环境变量。
  cuda_visible_devices: null

audio:
  # X-Talk turn detector 的统一输入起点为 16 kHz 单声道；具体 ASR/TTS 可在适配层重采样。
  sample_rate: 16000
  channels: 1
  dtype: float32
  # 每个音频块的时长（毫秒）；80 ms @16k = 1280 samples。
  chunk_ms: 80
  # local profile 使用真实设备名；replay/cluster 无音频设备时为 null。
  input_device: null
  output_device: null
  # 是否假定存在回声消除；headless 集群固定为 false。
  echo_cancellation: false
  # P0 冒烟脚本在缺少输入音频时合成的时长（秒）。
  smoke_seconds: 1.0

clock:
  # real: 使用墙上时钟；virtual: 离线回放按事件时间快速推进。
  mode: virtual
  # 功能对齐阶段的 micro-turn 实验起点；后续允许事件驱动提前触发。
  micro_turn_seconds: 0.6

xtalk:
  # X-Talk 是独立 fork；本仓库只记录来源和实验使用的提交。
  repo_url: https://github.com/Vitalrubbish/xtalk
  upstream_url: https://github.com/xcc-zach/xtalk
  repo_commit: 5f0d9959edf1026588246efbed827b078cbb114c
  base_image: docker.v2.aispeech.com/sjtu/sjtu_yukai-xuanzhang-xtalk:v0.17
  source_root: null
  # Selected candidates; model revisions and runtime integration remain pending.
  round1_config: configs/xtalk_round1.yaml
  baseline_status: candidate
  system_backchannel_enabled: false
  asr:
    model_id: Qwen/Qwen3-ASR-1.7B
    revision: null
    backend: qwen_asr_vllm_streaming
    adapter_status: pending
  llm_agent:
    type: DefaultAgent
    model_id: Qwen/Qwen3-8B-AWQ
    revision: null
    backchannel_model: null
    backchannel_source_dir: null
  tts:
    type: MossTTSRealtime
    model_id: OpenMOSS-Team/MOSS-TTS-Realtime
    revision: null
    codec_model_id: OpenMOSS-Team/MOSS-Audio-Tokenizer
    codec_revision: null
    output_sample_rate: 48000
  vad:
    backend: frontend_silero
  turn_detector:
    type: XTurnix
    model_id: xcczach/xturnix-zh-base
    revision: null

logging:
  level: INFO
  events_file: events.jsonl
