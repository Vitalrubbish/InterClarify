# Round-one model preparation; this is not a Xtalk.from_config runtime file.
schema_version: 1
baseline_status: candidate
target: duplexcascade_without_system_backchannel

sources:
  xtalk:
    repo_url: https://github.com/Vitalrubbish/xtalk.git
    commit: 5f0d9959edf1026588246efbed827b078cbb114c
  qwen_asr:
    repo_url: https://github.com/QwenLM/Qwen3-ASR.git
    commit: 7c6daf77a2421100f5fb066495372c00129d39ff
  moss_service:
    repo_url: https://github.com/xcc-zach/xtalk-moss-tts-realtime.git
    commit: b3306b97f8a64c1a2f25b9803c070ff32ecff6b1
  moss_source:
    repo_url: https://github.com/OpenMOSS/MOSS-TTS.git
    commit: 58b20a0d5fcc6766658d50967a90a9d890009a46

# Null revisions are resolved once into models.lock.json before downloading.
# The round-one LLM was changed from cpatonn/Qwen3-30B-A3B-Instruct-2507-AWQ-4bit
# to Qwen/Qwen3-8B-AWQ on 2026-10-09: the reference system DuplexCascade uses a
# 7B-class LLM (Qwen2-7B-Instruct), the verified local AWQ snapshot fits the
# 24 GB 4090 deployment, and the revision below is hash-verified against it.
models:
  asr:
    model_id: Qwen/Qwen3-ASR-1.7B
    revision: null
  llm:
    model_id: Qwen/Qwen3-8B-AWQ
    revision: 4da05a8edb55c6046cce958586c33b61da07bb79
  tts:
    model_id: OpenMOSS-Team/MOSS-TTS-Realtime
    revision: null
  codec:
    model_id: OpenMOSS-Team/MOSS-Audio-Tokenizer
    revision: null
  turn_detector:
    model_id: xcczach/xturnix-zh-base
    revision: null

environments:
  prepare: xtalk-round1-tools
  asr: xtalk-round1-asr
  llm: base
  turn_detector: base
  tts: xtalk-round1-moss
  client: xtalk-round1-client

dependency_candidates:
  vllm: "0.14.0"
  asr_transformers: "4.57.6"
  moss_torch: "2.9.1+cu128"
  moss_transformers: "5.0.0"
  # Required by the TTS flash_attention_2 path; shipped in the v0.3 image.
  moss_flash_attn: "2.8.3"

# GPU indices refer to devices allocated to this job.
services:
  llm:
    gpu_index: 0
    host: 127.0.0.1
    port: 8000
    served_model_name: xtalk-round1-llm
    max_model_len: 4096
    gpu_memory_utilization: 0.85
    quantization: awq
  turn_detector:
    gpu_index: 1
    host: 127.0.0.1
    port: 8003
    served_model_name: xturnix
    max_model_len: 2048
    gpu_memory_utilization: 0.35
  asr:
    gpu_index: 2
    gpu_memory_utilization: 0.75
    max_new_tokens: 32
  tts:
    gpu_index: 3
    host: 127.0.0.1
    port: 8004
    # flash_attention_2 selects MOSS's no-compile DynamicCache path (see
    # streaming_mossttsrealtime.py:84-105); it requires the flash-attn wheel
    # shipped in the v0.3 image (official 2.8.3, cu12torch2.9, torch 2.9.1).
    # The previous sdpa path went through torch.compile's StaticCache and
    # recompiled for each new generation length (minutes per shape), which is
    # the TTS latency bottleneck documented in the results doc.
    attn_impl: flash_attention_2
    output_sample_rate: 48000
    concurrency: 1
    # With attn_impl=flash_attention_2 MOSS skips torch.compile entirely, so
    # this setting is inert on that path; kept for the sdpa fallback.
    torch_compile: default

asr_streaming:
  sample_rate: 16000
  input_step_ms: 80
  chunk_size_sec: 0.6
  unfixed_chunk_num: 2
  unfixed_token_num: 5

runtime:
  integration_status: blocked_on_qwen_asr_adapter
  micro_turn_seconds: 0.6
  system_backchannel_enabled: false
  backchannel_model: null
  backchannel_source_dir: null
  frontend_vad_enabled: true
  llm_temperature: 0
  llm_max_tokens: 256
